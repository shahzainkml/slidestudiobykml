<!DOCTYPE html>
<!--
  Slide Studio
  Designed & built by Hamid Ali
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Hamid Ali">
<meta name="description" content="Slide Studio by Hamid Ali. Turn photos, titles and notes into a designed PowerPoint file.">
<meta name="theme-color" content="#0E1B33">
<title>Slide Studio by Hamid Ali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
  :root{
    --ink:#0E1B33; --cobalt:#2547F5; --cobalt-d:#1B37C4; --sun:#FFC93C;
    --table:#E8EDF5; --paper:#fff; --line:#D5DCE8; --muted:#5C6880; --green:#12A150;
    --display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
    --body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{font-family:var(--body);background:var(--table);color:var(--ink);min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}
  :focus-visible{outline:3px solid var(--sun);outline-offset:2px}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px max(18px,env(safe-area-inset-right)) 10px max(18px,env(safe-area-inset-left));background:var(--ink);color:#fff}
  .brand{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
  .brand svg{width:38px;height:38px;flex:none;display:block}
  .submit-btn{border:none;border-radius:999px;padding:11px 26px;font-size:15px;font-weight:600;background:#6E778A;color:#D9DEE8;transition:background .2s,transform .15s;cursor:not-allowed;min-height:44px}
  .submit-btn.ready{background:var(--green);color:#fff;cursor:pointer}
  .submit-btn.ready:hover{background:#0E8A44}
  .submit-btn.ready:active{transform:scale(.97)}

  /* ---------- owner credit ---------- */
  .owner{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
  .owner .av{width:68px;height:68px;border-radius:50%;border:3px solid var(--sun);background:var(--cobalt);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:23px;overflow:hidden;flex:none}
  .owner .av img{width:100%;height:100%;object-fit:cover;display:block}
  .owner small{opacity:.7;font-size:13px;margin-top:4px}
  .owner .nm{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em}
  .owner a.wa{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:inherit;text-decoration:none;padding:7px 14px;border-radius:999px;background:rgba(37,211,102,.16);margin-top:2px}
  .owner a.wa:hover{background:rgba(37,211,102,.28)}
  .owner a.wa svg{width:19px;height:19px;fill:#25D366;flex:none}

  /* ---------- landing ---------- */
  .landing{position:relative;isolation:isolate;background:var(--ink);color:#fff;min-height:calc(100vh - 58px);min-height:calc(100dvh - 58px);display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,4vw,64px);align-items:center;padding:clamp(28px,6vw,70px) clamp(20px,7vw,110px) 40px;overflow:hidden}
  .landing::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--hero) center 46%/cover no-repeat;transform:scale(1.04)}
  .landing::after{content:"";position:absolute;inset:0;z-index:-1;background:
    linear-gradient(0deg,rgba(14,27,51,.96) 0%,rgba(14,27,51,0) 34%),
    linear-gradient(100deg,rgba(14,27,51,.97) 0%,rgba(14,27,51,.9) 36%,rgba(14,27,51,.55) 68%,rgba(14,27,51,.3) 100%)}
  @media (prefers-reduced-motion:no-preference){
    .landing::before{animation:heroIn 1.6s cubic-bezier(.2,.7,.2,1) both}
    @keyframes heroIn{from{transform:scale(1.14);opacity:.4}}
  }
  .landing h1{font-family:var(--display);font-weight:800;font-size:clamp(42px,6.3vw,94px);line-height:.96;letter-spacing:-.035em}
  .landing h1 em{font-style:normal;display:block;color:var(--sun)}
  .landing p{margin:26px 0 34px;font-size:clamp(16px,2vw,20px);line-height:1.55;color:#B9C3D8;max-width:30em}
  .start-btn{background:var(--sun);color:var(--ink);border:none;border-radius:999px;padding:18px 40px;font-size:18px;font-weight:600;transition:transform .15s,box-shadow .2s;box-shadow:0 10px 30px rgba(255,201,60,.28);min-height:56px}
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(255,201,60,.4)}
  .start-btn:active{transform:scale(.98)}
  .landing .owner-slot{grid-column:1/-1;justify-self:center;color:#fff;padding-top:8px}

  .stack{position:relative;height:clamp(280px,34vw,420px);perspective:1200px}
  .sl{position:absolute;width:82%;aspect-ratio:16/10;border-radius:14px;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.45);padding:5% 6%;overflow:hidden}
  .sl .bar{position:absolute;left:0;top:0;right:0;height:7px;background:var(--cobalt)}
  .sl .tt{height:9%;width:48%;background:var(--ink);border-radius:4px;margin-bottom:5%}
  .sl .ln{height:5%;background:#D5DCE8;border-radius:3px;margin-bottom:3.5%}
  .sl .ph{height:50%;border-radius:8px}
  .sl .grid{display:grid;grid-template-columns:1fr 1fr;gap:3%;height:58%}
  .sl .grid i{border-radius:8px;display:block}
  .sl1{left:0;top:12%;transform:rotate(-7deg);z-index:1}
  .sl2{right:0;top:34%;transform:rotate(5deg);z-index:2}
  .sl3{left:9%;top:0;z-index:3;transform:rotate(-1deg)}
  .sl3 .ph{background:var(--hero) center 40%/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(14,27,51,.08)}
  .grid i:nth-child(1){background:linear-gradient(135deg,#12A150,#9BE2B4)}
  .grid i:nth-child(2){background:linear-gradient(135deg,#2547F5,#8FA6FF)}
  .grid i:nth-child(3){background:linear-gradient(135deg,#FF7A59,#FFC93C)}
  .grid i:nth-child(4){background:linear-gradient(135deg,#0E1B33,#5C6880)}
  @media (prefers-reduced-motion:no-preference){
    .sl1{animation:fan1 .9s .15s cubic-bezier(.2,.8,.2,1) both}
    .sl2{animation:fan2 .9s .3s cubic-bezier(.2,.8,.2,1) both}
    .sl3{animation:fan3 .9s 0s cubic-bezier(.2,.8,.2,1) both}
    @keyframes fan1{from{transform:translate(18%,10%) rotate(0)}}
    @keyframes fan2{from{transform:translate(-18%,-18%) rotate(0)}}
    @keyframes fan3{from{transform:translateY(8%)}}
  }
  @media(max-width:820px){
    .landing{grid-template-columns:1fr}
    .landing::after{background:linear-gradient(180deg,rgba(14,27,51,.78) 0%,rgba(14,27,51,.9) 55%,rgba(14,27,51,.97) 100%)}
    .stack{order:-1;height:clamp(230px,60vw,330px)}
  }

  /* ---------- editor ---------- */
  .editor{max-width:1360px;margin:0 auto;padding:26px max(16px,env(safe-area-inset-left)) 40px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
  .rail{position:sticky;top:84px;display:flex;flex-direction:column;gap:6px}
  .rail h3{font-family:var(--display);font-size:15px;margin-bottom:6px;color:var(--muted);font-weight:600}
  .rail a{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px;background:transparent;transition:background .15s}
  .rail a:hover{background:#fff}
  .rail a span.n{flex:none;width:24px;height:24px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
  .rail a span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail a.empty span.t{color:var(--muted)}
  @media(max-width:900px){.editor{grid-template-columns:1fr}.rail{display:none}}

  .slide-card{background:var(--paper);border-radius:18px;margin-bottom:22px;box-shadow:0 1px 0 rgba(14,27,51,.05),0 12px 32px rgba(14,27,51,.08);scroll-margin-top:84px;overflow:hidden}
  .card-head{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line)}
  .card-head b{font-family:var(--display);font-size:17px;font-weight:800}
  .del{border:none;background:none;color:var(--muted);font-size:14px;padding:8px 12px;border-radius:8px;min-height:40px}
  .del:hover{background:#FDECEC;color:#C0322B}

  .card-body{padding:24px 22px 26px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"t" "ph" "pv" "c"}
  .f-title{grid-area:t}.f-photos{grid-area:ph}.f-prev{grid-area:pv}.f-content{grid-area:c}
  @media(min-width:1100px){
    .card-body{grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);column-gap:32px;grid-template-areas:"t pv" "ph pv" "c pv"}
    .f-prev{align-self:start;position:sticky;top:84px}
  }
  .field{margin-bottom:26px}
  .f-content{margin-bottom:0}
  label.lbl,.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:9px}
  .title-in{width:100%;border:none;border-bottom:2px solid var(--line);font-family:var(--display);font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.02em;padding:6px 0 12px;outline:none;background:transparent;color:var(--ink);transition:border-color .2s;border-radius:0}
  .title-in::placeholder{color:#A7B0C2}
  .title-in:focus{border-color:var(--cobalt)}
  .drop{border:2px dashed #B4BFD3;border-radius:14px;padding:22px 18px;text-align:center;color:var(--muted);transition:.2s;cursor:pointer;background:#F7F9FD;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .drop:hover,.drop.over{border-color:var(--cobalt);background:#EEF2FF;color:var(--cobalt)}
  .drop svg{width:32px;height:32px;margin-bottom:6px;stroke:currentColor}
  .drop strong{display:block;font-size:16px;color:var(--ink);margin-bottom:3px}
  .drop span{font-size:14px}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .th{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:#E8EDF5}
  .th img{width:100%;height:100%;object-fit:cover;display:block}
  .th button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(14,27,51,.78);color:#fff;font-size:15px;line-height:1}
  .content-in{width:100%;min-height:140px;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.6;font-family:inherit;outline:none;resize:vertical;transition:.2s;color:var(--ink);background:#fff}
  .content-in:focus{border-color:var(--cobalt);box-shadow:0 0 0 4px rgba(37,71,245,.12)}
  .hint{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.5}

  /* ---------- live slide preview ---------- */
  .pv{position:relative;container-type:inline-size;aspect-ratio:16/9;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 28px rgba(14,27,51,.12)}
  .pv > *{position:absolute}
  .pv-bar{background:var(--cobalt)}
  .pv-line{background:var(--sun)}
  .pv-title{display:flex;align-items:center;font-family:var(--display);font-weight:800;color:var(--ink);line-height:1.12;overflow:hidden}
  .pv-title span{display:block;max-height:100%;overflow:hidden}
  .pv-title.center{justify-content:center;text-align:center}
  .pv-empty{inset:0;display:grid;place-items:center;color:#9AA4B8;font-size:3cqw;text-align:center;padding:0 8%}
  .pv-cell{overflow:hidden;background:#E8EDF5;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
  .pv-cell:active{cursor:grabbing}
  .pv-cell.sel{touch-action:none;outline:2px solid var(--cobalt);outline-offset:-2px;z-index:2}
  .pv-cell canvas{width:100%;height:100%;display:block;pointer-events:none}
  .pv-ctl{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:none;gap:1px;background:rgba(14,27,51,.88);border-radius:999px;padding:2px;z-index:3}
  .pv-cell.sel .pv-ctl{display:flex}
  @media(hover:hover){.pv-cell:hover .pv-ctl{display:flex}}
  .pv-ctl button{width:24px;height:24px;border:none;border-radius:50%;background:transparent;color:#fff;font-size:15px;line-height:1;display:grid;place-items:center}
  .pv-ctl button:hover{background:rgba(255,255,255,.2)}
  .pv-card{background:#EEF1F8;box-shadow:inset .675cqw 0 0 var(--cobalt);padding:1.6cqw 2cqw 1.6cqw 3cqw;color:#1F2A44;line-height:1.35;overflow:hidden;font-family:var(--body)}
  .pv-card ul{margin:0;padding-left:1.4em}
  .pv-card li{margin-bottom:.35em}
  .pv-card.mid{display:flex;align-items:center}
  .pv-tip{display:flex;gap:8px;align-items:flex-start}
  .pv-tip b{font-weight:600;color:var(--ink)}

  .add-btn{width:100%;border:2px dashed var(--ink);background:transparent;color:var(--ink);border-radius:18px;padding:22px;font-size:17px;font-weight:600;transition:.2s;min-height:60px}
  .add-btn:hover{background:var(--ink);color:#fff}
  .foot{grid-column:1/-1;display:flex;justify-content:center;color:var(--ink);padding:30px 0 10px;border-top:1px solid var(--line);margin-top:6px}
  .main-col{min-width:0}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(14,27,51,.6);z-index:50;display:grid;place-items:center;padding:20px}
  .sheet{background:#fff;border-radius:22px;width:100%;max-width:480px;padding:30px 28px calc(24px + env(safe-area-inset-bottom));box-shadow:0 30px 80px rgba(0,0,0,.4);max-height:92vh;overflow:auto}
  .sheet h2{font-family:var(--display);font-size:26px;letter-spacing:-.02em;margin-bottom:6px}
  .sheet .sub{color:var(--muted);font-size:15px;margin-bottom:20px}
  .sheet input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;outline:none;font-family:inherit;margin-bottom:16px}
  .sheet input[type=text]:focus{border-color:var(--cobalt)}
  .sheet .lbl2{font-size:14px;font-weight:600;margin-bottom:9px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:500;min-height:40px;display:inline-flex;align-items:center;gap:8px;transition:.15s}
  .chip i{width:12px;height:12px;border-radius:50%;display:block;flex:none}
  .chip:hover{border-color:var(--cobalt)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chk{display:flex;align-items:center;gap:11px;font-size:15px;margin-bottom:12px;cursor:pointer;min-height:30px}
  .chk input{accent-color:var(--cobalt);width:20px;height:20px;flex:none}
  .dl{width:100%;margin-top:12px;background:var(--cobalt);color:#fff;border:none;border-radius:999px;padding:16px;font-size:17px;font-weight:600;transition:.2s;min-height:56px}
  .dl:hover{background:var(--cobalt-d)}
  .dl:disabled{opacity:.65;cursor:wait}
  .cancel{width:100%;margin-top:6px;background:none;border:none;color:var(--muted);padding:12px;font-size:15px}
  .ok{color:var(--green);font-weight:600;text-align:center;margin-top:12px;font-size:15px;line-height:1.4}
  .by{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}
  .by b{color:var(--ink)}
  @media(max-width:560px){
    .overlay{align-items:end;padding:0}
    .sheet{border-radius:22px 22px 0 0;max-width:none}
    .card-body{padding:20px 16px 22px}
    .card-head{padding:12px 16px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span id="logoSlot"></span><span>Slide Studio</span></div>
  <button id="submitBtn" class="submit-btn hidden" disabled>Submit</button>
</header>

<!-- Landing -->
<section id="landing" class="landing">
  <div>
    <h1>Photos in.<em>Presentation out.</em></h1>
    <p>Write a title, drop in your photos, add your notes. Slide Studio lays out every page and gives you a finished PowerPoint file to download.</p>
    <button class="start-btn" id="startBtn">Start with me</button>
  </div>
  <div class="stack" aria-hidden="true">
    <div class="sl sl1"><div class="bar"></div><div class="tt"></div><div class="grid"><i></i><i></i><i></i><i></i></div></div>
    <div class="sl sl2"><div class="bar"></div><div class="tt" style="width:36%"></div><div class="ln"></div><div class="ln" style="width:85%"></div><div class="ln" style="width:60%"></div></div>
    <div class="sl sl3"><div class="bar"></div><div class="tt" style="width:60%"></div><div class="ph"></div><div class="ln" style="margin-top:4%;width:80%"></div></div>
  </div>
  <div class="owner-slot"></div>
</section>

<!-- Editor -->
<div id="editor" class="editor hidden">
  <nav class="rail" id="rail" aria-label="Pages"></nav>
  <main class="main-col">
    <div id="slides"></div>
    <button class="add-btn" id="addBtn">+ Add another page</button>
  </main>
  <div class="foot owner-slot"></div>
</div>

<!-- Modal -->
<div id="overlay" class="overlay hidden">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">Your presentation is ready</h2>
    <p class="sub" id="summary"></p>
    <input type="text" id="deckName" placeholder="Presentation name" value="My Presentation" aria-label="Presentation name">
    <div class="lbl2">Slide style</div>
    <div class="chips" id="chips"></div>
    <div id="bgBox" class="hidden">
      <div class="lbl2">Office photo background</div>
      <div class="chips" id="bgChips"></div>
    </div>
    <label class="chk"><input type="checkbox" id="optCover" checked> Add a cover slide</label>
    <label class="chk"><input type="checkbox" id="optThanks"> Add a "Thank you" slide at the end</label>
    <button class="dl" id="dlBtn">Download PPT</button>
    <div class="ok hidden" id="okMsg"></div>
    <button class="cancel" id="closeBtn">Close</button>
    <div class="by">Made with Slide Studio by <b>Hamid Ali</b></div>
  </div>
</div>

<script>
/* Slide Studio - designed & built by Hamid Ali */

/* ================= YOUR DETAILS (edit these) ================= */

/* ================= Image helpers ================= */
function loadImage(src){
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
function fileToDataUrl(file){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}
/* A photo = { el, w, h, fx, fy, zoom, thumb }.  fx / fy (0..1) say which part of the photo is shown, zoom >= 1. */
async function prepPhoto(file){
  const raw = await loadImage(await fileToDataUrl(file));
  const max = 1800, k = Math.min(1, max / Math.max(raw.width, raw.height));
  const c = document.createElement('canvas');
  c.width = Math.round(raw.width * k); c.height = Math.round(raw.height * k);
  c.getContext('2d').drawImage(raw, 0, 0, c.width, c.height);
  const el = await loadImage(c.toDataURL('image/jpeg', 0.88));
  const t = document.createElement('canvas'); t.width = t.height = 128;
  const m = Math.min(c.width, c.height);
  t.getContext('2d').drawImage(c, (c.width - m) / 2, (c.height - m) / 2, m, m, 0, 0, 128, 128);
  return { el, w: c.width, h: c.height, fx: .5, fy: .5, zoom: 1, thumb: t.toDataURL('image/jpeg', 0.7) };
}
/* which rectangle of the photo is visible inside a frame of this shape */
function cropRect(p, ratio){
  let sw, sh;
  if (p.w / p.h > ratio){ sh = p.h; sw = sh * ratio; } else { sw = p.w; sh = sw / ratio; }
  sw /= p.zoom; sh /= p.zoom;
  return { sx: (p.w - sw) * p.fx, sy: (p.h - sh) * p.fy, sw, sh };
}
function cropToRatio(p, ratio){
  const r = cropRect(p, ratio);
  const c = document.createElement('canvas');
  c.width = Math.round(Math.min(1600, r.sw)); c.height = Math.max(1, Math.round(c.width / ratio));
  c.getContext('2d').drawImage(p.el, r.sx, r.sy, r.sw, r.sh, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.88);
}

/* same photo grid the PowerPoint uses */
function gridCells(n, x, y, w, h, gap = 0.15){
  const cols = n === 1 ? 1 : n === 2 ? 2 : n === 3 ? 3 : n === 4 ? 2 : 3;
  const rows = Math.ceil(n / cols);
  const cw = (w - gap * (cols - 1)) / cols, ch = (h - gap * (rows - 1)) / rows;
  const cells = [];
  for (let i = 0; i < n; i++){
    const r = Math.floor(i / cols), c = i % cols;
    const inRow = r === rows - 1 ? n - r * cols : cols;
    const off = (cols - inRow) * (cw + gap) / 2;
    cells.push({ x: x + off + c * (cw + gap), y: y + r * (ch + gap), w: cw, h: ch });
  }
  return cells;
}
function slideLayout(s){
  const title = s.title.trim(), text = s.content.trim(), n = s.photos.length;
  const top = title ? 1.75 : 0.6, bh = 6.85 - top, cw = W - 1.2, gap = 0.3;
  const hasText = !!text;
  const pw = hasText && n ? 7.5 : cw;
  const tw = hasText && n ? cw - pw - gap : cw;
  return { title, text, n, top, bh, cw, gap, hasText, pw, tw };
}
const textSize = (chars, hasPhotos) => (chars < 200 ? 22 : chars < 450 ? 18 : chars < 800 ? 15 : 12) + (hasPhotos ? 0 : 2);

/* ================= Live preview ================= */
function schedulePreview(card, s){
  if (card._raf) return;
  card._raf = requestAnimationFrame(() => { card._raf = 0; renderPreview(card, s); });
}
function drawCell(cv, p, ratio){
  const r = cropRect(p, ratio);
  cv.getContext('2d').drawImage(p.el, r.sx, r.sy, r.sw, r.sh, 0, 0, cv.width, cv.height);
}

function renderPreview(card, s){
  const pv = card.querySelector('.pv');
  const L = slideLayout(s);
  pv.innerHTML = '';
  if (!L.title && !L.text && !L.n){
    const e = document.createElement('div');
    e.className = 'pv-empty'; e.textContent = 'Your slide preview appears here';
    pv.appendChild(e); return;
  }
  const pct = (v, t) => (v / t * 100).toFixed(3) + '%';
  const add = (cls, x, y, w, h) => {
    const e = document.createElement('div'); e.className = cls;
    e.style.left = pct(x, W); e.style.top = pct(y, H); e.style.width = pct(w, W); e.style.height = pct(h, H);
    pv.appendChild(e); return e;
  };
  add('pv-bar', 0, 0, W, 0.14);

  if (L.title && !L.text && !L.n){
    const t = add('pv-title center', 1, 2.4, W - 2, 2.4);
    t.style.fontSize = (L.title.length > 40 ? 3.4 : 4.8) + 'cqw';
    const sp = document.createElement('span'); sp.dir = 'auto'; sp.textContent = L.title; t.appendChild(sp);
    add('pv-line', W / 2 - 0.6, 4.95, 1.2, 0.09);
    return;
  }

  if (L.title){
    const t = add('pv-title', 0.6, 0.4, W - 1.2, 0.95);
    t.style.fontSize = (L.title.length > 45 ? 2.5 : 3.33) + 'cqw';
    const sp = document.createElement('span'); sp.dir = 'auto'; sp.textContent = L.title; t.appendChild(sp);
    add('pv-line', 0.6, 1.38, 0.9, 0.08);
  }

  if (L.n){
    gridCells(L.n, 0.6, L.top, L.pw, L.bh).forEach((c, i) => {
      const p = s.photos[i];
      const ratio = c.w / c.h;
      const el = add('pv-cell', c.x, c.y, c.w, c.h);
      const cv = document.createElement('canvas');
      cv.width = Math.max(80, Math.round(c.w / W * 1000)); cv.height = Math.max(1, Math.round(cv.width / ratio));
      el.appendChild(cv); drawCell(cv, p, ratio);
      if (card._sel === i) el.classList.add('sel');

      const ctl = document.createElement('div'); ctl.className = 'pv-ctl';
      const mk = (label, aria, fn) => {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.setAttribute('aria-label', aria);
        b.addEventListener('pointerdown', e => e.stopPropagation());
        b.addEventListener('click', e => { e.stopPropagation(); select(i); fn(); drawCell(cv, p, ratio); });
        ctl.appendChild(b);
      };
      mk('−', 'Zoom out', () => { p.zoom = clamp(p.zoom - 0.25, 1, 4); });
      mk('+', 'Zoom in', () => { p.zoom = clamp(p.zoom + 0.25, 1, 4); });
      mk('↺', 'Reset this photo', () => { p.zoom = 1; p.fx = p.fy = .5; });
      el.appendChild(ctl);

      let drag = null;
      el.addEventListener('pointerdown', e => {
        if (e.button > 0) return;
        select(i);
        const r0 = cropRect(p, ratio), rect = el.getBoundingClientRect();
        drag = { x: e.clientX, y: e.clientY, sx: r0.sx, sy: r0.sy, sw: r0.sw, sh: r0.sh, rw: rect.width, rh: rect.height };
        try { el.setPointerCapture(e.pointerId); } catch(_){}
      });
      el.addEventListener('pointermove', e => {
        if (!drag) return;
        const maxX = p.w - drag.sw, maxY = p.h - drag.sh;
        const sx = clamp(drag.sx - (e.clientX - drag.x) * drag.sw / drag.rw, 0, maxX);
        const sy = clamp(drag.sy - (e.clientY - drag.y) * drag.sh / drag.rh, 0, maxY);
        p.fx = maxX > 0.5 ? sx / maxX : .5;
        p.fy = maxY > 0.5 ? sy / maxY : .5;
        drawCell(cv, p, ratio);
      });
      const end = () => { drag = null; };
      el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
      el.addEventListener('wheel', e => {
        if (!el.classList.contains('sel')) return;
        e.preventDefault();
        p.zoom = clamp(p.zoom + (e.deltaY < 0 ? 0.2 : -0.2), 1, 4);
        drawCell(cv, p, ratio);
      }, { passive: false });
    });
  }

  if (L.hasText){
    const x = L.n ? 0.6 + L.pw + L.gap : 0.6;
    const box = add('pv-card', x, L.top, L.tw, L.bh);
    box.style.fontSize = (textSize(L.text.length, L.n > 0) / 9.6).toFixed(2) + 'cqw';
    const lines = L.text.split(/\n+/).map(l => l.trim()).filter(Boolean);
    if (lines.length > 1){
      const ul = document.createElement('ul');
      lines.forEach(l => { const li = document.createElement('li'); li.dir = 'auto'; li.textContent = l; ul.appendChild(li); });
      box.appendChild(ul);
    } else {
      if (L.text.length < 160) box.classList.add('mid');
      const p = document.createElement('p'); p.dir = 'auto'; p.textContent = lines[0]; box.appendChild(p);
    }
  }

  function select(i){
    card._sel = i;
    pv.querySelectorAll('.pv-cell').forEach((c, k) => c.classList.toggle('sel', k === i));
  }
}

function addSlide(){

function buildCard(s){
  const card = document.createElement('section');
  card.className = 'slide-card';
  card.id = 'card-' + s.id;
  card._sel = -1;
  card.innerHTML = `
    <div class="card-head"><b class="num"></b><button class="del">Delete page</button></div>
    <div class="card-body">
      <div class="field f-title">
        <label class="lbl">Title</label>
        <input class="title-in" type="text" placeholder="Write your title here" dir="auto" enterkeyhint="next">
      </div>
      <div class="field f-photos">
        <label class="lbl">Photos</label>
        <div class="drop" tabindex="0" role="button" aria-label="Upload photos">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>

          <span>One photo fills the page. Several photos make a grid.</span>
          <input type="file" accept="image/*" multiple class="hidden">
        </div>
        <div class="thumbs"></div>
      </div>
      <div class="field f-prev">
        <div class="lbl">Slide preview</div>
        <div class="pv"></div>
        <div class="hint">Drag a photo to choose which part shows. Use + and − to zoom, ↺ to reset. On a phone, tap a photo first, then drag. Colours and fonts change with the style you pick at download.</div>
      </div>
      <div class="field f-content">
        <label class="lbl">Content</label>
        <textarea class="content-in" placeholder="Write anything you want here" dir="auto"></textarea>
        <div class="hint">Each new line becomes a bullet point on the slide.</div>
      </div>
    </div>`;

  const title = card.querySelector('.title-in');
  const content = card.querySelector('.content-in');
  const drop = card.querySelector('.drop');
  const file = card.querySelector('input[type=file]');

  title.addEventListener('input', () => { s.title = title.value; refresh(); schedulePreview(card, s); });
  content.addEventListener('input', () => { s.content = content.value; refresh(); schedulePreview(card, s); });
  card.querySelector('.del').addEventListener('click', () => {
    if (slides.length === 1){ s.title = s.content = ''; s.photos = []; title.value = content.value = ''; card._sel = -1; renderPhotos(card, s); refresh(); return; }
    slides = slides.filter(x => x.id !== s.id); card.remove(); renumber(); refresh();
  });

  drop.addEventListener('click', () => file.click());
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); file.click(); } });
  file.addEventListener('click', e => e.stopPropagation());
  file.addEventListener('change', () => { addFiles(card, s, file.files); file.value = ''; });
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => addFiles(card, s, e.dataTransfer.files));
  renderPreview(card, s);
  return card;
}

async function addFiles(card, s, files){
  for (const f of Array.from(files)){
    if (!f.type.startsWith('image/')) continue;
    try { s.photos.push(await prepPhoto(f)); }
    catch(e){ alert('Could not read "' + f.name + '". Use a JPG or PNG photo.'); }
  }
  renderPhotos(card, s); refresh();
}

function renderPhotos(card, s){
  const box = card.querySelector('.thumbs');
  box.innerHTML = '';
  s.photos.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'th';
    d.innerHTML = '<img alt="Photo ' + (i + 1) + '"><button type="button" aria-label="Remove photo ' + (i + 1) + '">&times;</button>';
    d.querySelector('img').src = p.thumb;
    d.querySelector('button').onclick = () => { s.photos.splice(i, 1); card._sel = -1; renderPhotos(card, s); refresh(); };
    box.appendChild(d);
  });
  renderPreview(card, s);
}

function renumber(){
  document.querySelectorAll('.slide-card .num').forEach((el, i) => el.textContent = 'Page ' + (i + 1));

function lastThemeId(){ try { return localStorage.getItem('ss_last_theme') || ''; } catch(e){ return ''; } }
function saveThemeId(id){ try { localStorage.setItem('ss_last_theme', id); } catch(e){} }
function pickTheme(){
  if (chosenStyle !== 'auto') return THEMES.find(t => t.id === chosenStyle);
  const last = lastThemeId();
  const pool = THEMES.filter(t => t.id !== last);          // never repeat the previous style
  const t = pool[Math.floor(Math.random() * pool.length)];
  saveThemeId(t.id);
  return t;
}

/* ================= PPT generation ================= */
const isRTL = t => /[؀-ۿ]/.test(t);
const strip = d => d.replace(/^data:/, '');
const box = (s, x, y, w, h, color, extra = {}) => s.addShape('rect', Object.assign({ x, y, w, h, fill:{ color }, line:{ color, width:0 } }, extra));

/* full-slide office photo with a dark veil so white text stays readable */
function photoBackdrop(s, t, bg){
  s.background = { color:t.dark };
  s.addImage({ data:strip(bg), x:0, y:0, w:W, h:H });
  box(s, 0, 0, W, H, t.dark, { fill:{ color:t.dark, transparency:38 } });
}

function addCover(pptx, t, name, count, bg){
  const s = pptx.addSlide();
  const photo = !!bg;
  const rtl = isRTL(name);
  const dateStr = new Date().toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
  const sub = count + (count === 1 ? ' page' : ' pages') + '   |   ' + dateStr;
  const INK = photo ? 'FFFFFF' : t.ink, MUT = photo ? 'E3E8F2' : t.muted;
  const setBg = color => { if (photo) photoBackdrop(s, t, bg); else s.background = { color }; };
  const titleOpts = { fontFace:t.head, bold:true, fit:'shrink', rtlMode:rtl };
  switch (t.cover){
    case 'circles':
      setBg(t.dark);
      box(s, 0, 0, 0.35, H, t.accent);
      s.addShape('ellipse', { x:9.4, y:-1.6, w:6.2, h:6.2, fill:{ color:t.accent, transparency:70 }, line:{ color:t.accent, width:0 } });
      s.addShape('ellipse', { x:10.8, y:4.6, w:4.4, h:4.4, fill:{ color:t.accent2, transparency:20 }, line:{ color:t.accent2, width:0 } });
      s.addText(name, { ...titleOpts, x:1, y:2.2, w:9, h:2.0, fontSize:50, color:'FFFFFF', valign:'bottom' });
      box(s, 1.05, 4.38, 1.3, 0.09, t.accent2);
      s.addText(sub, { x:1, y:4.65, w:8, h:0.4, fontSize:16, color:'D5DCE8', fontFace:t.body });
      break;
    case 'split':
      setBg(t.bg);
      box(s, 0, 0, 4.7, H, t.accent, photo ? { fill:{ color:t.accent, transparency:8 } } : {});
      s.addText(String(count).padStart(2, '0'), { x:0.5, y:2.1, w:3.8, h:2.2, fontSize:110, bold:true, color:'FFFFFF', fontFace:t.head, valign:'bottom' });
      s.addText(count === 1 ? 'page' : 'pages', { x:0.58, y:4.35, w:3.6, h:0.5, fontSize:22, color:'FFFFFF', fontFace:t.body });
      s.addText(name, { ...titleOpts, x:5.3, y:1.9, w:7.4, h:2.4, fontSize:46, color:INK, valign:'bottom' });
      box(s, 5.35, 4.5, 1.3, 0.09, t.accent2);
      s.addText(dateStr, { x:5.3, y:4.75, w:7, h:0.4, fontSize:16, color:MUT, fontFace:t.body });
      break;
    case 'frame':
      setBg(t.dark);
      s.addShape('rect', { x:0.45, y:0.45, w:W-0.9, h:H-0.9, fill:{ color:t.dark, transparency:100 }, line:{ color:t.accent2, width:2.5 } });
      s.addText(name, { ...titleOpts, x:1.2, y:2.1, w:W-2.4, h:2.0, fontSize:50, color:'FFFFFF', align:'center', valign:'bottom' });
      box(s, W/2 - 0.65, 4.3, 1.3, 0.09, t.accent2);
      s.addText(sub, { x:1.2, y:4.6, w:W-2.4, h:0.4, fontSize:16, color:'DCE8E0', align:'center', fontFace:t.body });
      break;
    case 'blocks':
      setBg(t.dark);
      box(s, 7.8, 3.4, W-7.8, H-3.4, t.accent);
      box(s, 10.3, 0, W-10.3, 3.4, t.accent2);
      s.addText(name, { ...titleOpts, x:0.9, y:1.9, w:6.6, h:2.6, fontSize:48, color:'FFFFFF', valign:'bottom' });
      box(s, 0.95, 4.7, 1.3, 0.09, t.accent2);
      s.addText(sub, { x:0.9, y:4.95, w:6.6, h:0.4, fontSize:16, color:'E4DDF2', fontFace:t.body });
      break;
    case 'big':
      setBg(t.bg);
      s.addText(name, { ...titleOpts, x:0.9, y:1.0, w:11.4, h:3.4, fontSize:72, color:INK, valign:'top' });
      box(s, 0.95, 4.6, 3, 0.18, t.accent);
      box(s, 0, H-1.0, W, 1.0, t.ink);
      s.addText(sub, { x:0.9, y:H-0.82, w:9, h:0.6, fontSize:18, color:'FFFFFF', fontFace:t.body, valign:'middle' });
      s.addShape('ellipse', { x:W-2.3, y:H-1.7, w:1.3, h:1.3, fill:{ color:t.accent }, line:{ color:t.accent, width:0 } });
      break;
    case 'wave':
      setBg(t.dark);
      box(s, 0, 5.15, W, 0.5, t.accent, { fill:{ color:t.accent, transparency:60 } });
      box(s, 0, 5.75, W, 0.6, t.accent, { fill:{ color:t.accent, transparency:30 } });
      box(s, 0, 6.45, W, 1.05, t.accent);
      s.addText(name, { ...titleOpts, x:0.9, y:1.5, w:9.5, h:2.3, fontSize:50, color:'FFFFFF', valign:'bottom' });
      box(s, 0.95, 4.0, 1.3, 0.09, t.accent2);
      s.addText(sub, { x:0.9, y:4.25, w:9, h:0.4, fontSize:16, color:'D5EAE8', fontFace:t.body });
      break;
  }
}

function addEnd(pptx, t, bg){
  const s = pptx.addSlide();
  if (bg) photoBackdrop(s, t, bg); else s.background = { color:t.dark };
  box(s, 0, 0, 0.35, H, t.accent);
  s.addText('Thank you', { x:1, y:2.7, w:10, h:1.5, fontSize:60, bold:true, color:'FFFFFF', fontFace:t.head });
  box(s, 1.05, 4.3, 1.3, 0.09, t.accent2 === '6B7280' ? t.accent : t.accent2);
}

async function buildPptx(name, withCover, withThanks, t, bgMode){
  const pptx = new PptxGenJS();
  pptx.layout = 'LAYOUT_WIDE';
  pptx.title = name;
  pptx.company = 'Slide Studio by Hamid Ali';
  const items = slides.filter(isFilled);

  /* office photo: one full-slide crop and one thin banner crop */
  let bgFull = null, bgBanner = null;
  if (OFFICE_BG && bgMode !== 'off'){
    const el = await loadImage(OFFICE_BG);
    const bp = { el, w: el.naturalWidth, h: el.naturalHeight, fx: .5, fy: .5, zoom: 1 };
    bgFull = cropToRatio(bp, W / H);
    if (bgMode === 'all') bgBanner = cropToRatio({ ...bp, fy: .3 }, W / 1.45);
  }

  if (withCover) addCover(pptx, t, name, items.length, bgFull);

  let num = withCover ? 2 : 1;
  for (const it of items){
    const myNum = num++;
    const s = pptx.addSlide();
    s.background = { color:t.bg };
    const title = it.title.trim(), text = it.content.trim(), n = it.photos.length;
    const footer = (L, col) => {
      s.addText(name, { x:L, y:7.0, w:8, h:0.3, fontSize:10, color:col, fontFace:t.body });
      s.addText(String(myNum), { x:W-1.6, y:7.0, w:1, h:0.3, fontSize:10, color:col, align:'right', fontFace:t.body });
    };

    /* only a title -> big statement slide */
    if (title && !text && !n){
      const onPhoto = bgMode === 'all' && bgFull;
      if (onPhoto) photoBackdrop(s, t, bgFull);
      footer(onPhoto ? 0.6 : 0.6, onPhoto ? 'D5DCE8' : t.muted);
      s.addText(title, { x:1, y:2.4, w:W-2, h:2.4, fontSize:46, bold:true, color:onPhoto ? 'FFFFFF' : t.ink, align:'center', valign:'middle', fontFace:t.head, fit:'shrink', rtlMode:isRTL(title) });
      box(s, W/2 - 0.6, 4.95, 1.2, 0.09, onPhoto ? t.accent2 : t.accent);
      continue;
    }

    const useBanner = !!(bgBanner && title);
    let L = 0.6;
    if (useBanner){
      s.addImage({ data:strip(bgBanner), x:0, y:0, w:W, h:1.45 });
      box(s, 0, 0, W, 1.45, t.dark, { fill:{ color:t.dark, transparency:35 } });
      box(s, 0, 1.45, W, 0.08, t.accent);
    } else {
      if (t.header === 'underline') box(s, 0, 0, W, 0.14, t.accent);
      if (t.header === 'side'){ box(s, 0, 0, 0.35, H, t.accent); box(s, 0.35, 0, 0.07, H, t.accent2); L = 1.0; }
    }
    const cw = W - L - 0.6;
    footer(L, t.muted);

    let top = 0.6;
    if (title){
      const rt = isRTL(title);
      const common = { fontFace:t.head, bold:true, valign:'middle', fit:'shrink', align: rt ? 'right' : 'left', rtlMode:rt };
      if (useBanner){
        s.addText(title, { ...common, x:L, y:0.2, w:cw, h:1.05, fontSize:32, color:'FFFFFF' });
        top = 1.95;
      } else switch (t.header){
        case 'rule':
          s.addText(title, { ...common, x:L, y:0.35, w:cw, h:1.0, fontSize:34, color:t.ink });
          box(s, L, 1.42, cw, 0.025, t.ink); box(s, L, 1.36, 0.9, 0.1, t.accent);
          top = 1.85; break;
        case 'band':
          box(s, 0, 0, W, 1.35, t.dark); box(s, 0, 1.35, W, 0.08, t.accent);
          s.addText(title, { ...common, x:L, y:0.2, w:cw, h:0.95, fontSize:32, color:'FFFFFF' });
          top = 1.85; break;
        case 'bignum':
          s.addText(String(myNum).padStart(2, '0'), { x:W-3.2, y:0.05, w:2.6, h:1.5, fontSize:88, bold:true, color:t.accent, transparency:80, align:'right', fontFace:t.head });
          s.addText(title, { ...common, x:L, y:0.4, w:cw-2.6, h:0.95, fontSize:32, color:t.ink });
          box(s, L, 1.45, 2.2, 0.07, t.ink);
          top = 1.85; break;
        case 'boxed':
          s.addShape('roundRect', { x:L, y:0.4, w:cw, h:1.0, fill:{ color:t.accent }, line:{ color:t.accent, width:0 }, rectRadius:0.12 });
          s.addText(title, { ...common, x:L+0.3, y:0.4, w:cw-0.6, h:1.0, fontSize:30, color:'FFFFFF' });
          top = 1.8; break;
        default: // underline, side
          s.addText(title, { ...common, x:L, y:0.4, w:cw, h:0.95, fontSize:32, color:t.ink });
          box(s, L, 1.38, 0.9, 0.08, t.accent2);
          top = 1.75;
      }
    }

    const bottom = 6.85, bh = bottom - top, gap = 0.3;
    const hasText = !!text;
    const pw = hasText && n ? 7.5 : cw;
    const tw = hasText && n ? cw - pw - gap : cw;
    const right = t.photoSide === 'right';
    const photoX = hasText && n && right ? L + tw + gap : L;
    const textX  = hasText && n ? (right ? L : L + pw + gap) : L;

    if (n){
      const cells = gridCells(n, photoX, top, pw, bh);
      for (let i = 0; i < n; i++){
        const c = cells[i];
        if (t.frame) box(s, c.x - 0.06, c.y - 0.06, c.w + 0.12, c.h + 0.12, t.accent2);
        const data = cropToRatio(it.photos[i], c.w / c.h);
        s.addImage({ data: strip(data), x:c.x, y:c.y, w:c.w, h:c.h });
      }
    }
    if (hasText){
      box(s, textX, top, tw, bh, t.card);
      if (t.cardBar === 'top') box(s, textX, top, tw, 0.09, t.accent);
      else box(s, textX, top, 0.09, bh, t.accent);
      const padL = t.cardBar === 'top' ? 0.3 : 0.35, padT = t.cardBar === 'top' ? 0.35 : 0.2;
      const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
      const multi = lines.length > 1, chars = text.length;
      const size = textSize(chars, n > 0);
      const rtl = isRTL(text);
      const runs = lines.map(l => ({ text:l, options:{ bullet: multi ? { indent:20 } : false, breakLine:true, paraSpaceAfter:10 } }));
      s.addText(runs, { x:textX + padL, y:top + padT, w:tw - padL - 0.25, h:bh - padT - 0.2, fontSize:size, color:t.text, fontFace:t.body, valign: chars < 160 && !multi ? 'middle' : 'top', fit:'shrink', align: rtl ? 'right' : 'left', rtlMode:rtl });
    }
  }

  if (withThanks) addEnd(pptx, t, bgFull);
  return pptx;
}

$('dlBtn').onclick = async () => {
  const btn = $('dlBtn');
  const name = $('deckName').value.trim() || 'My Presentation';
  btn.disabled = true; btn.textContent = 'Designing your slides...';
  try {
    const theme = pickTheme();
    const pptx = await buildPptx(name, $('optCover').checked, $('optThanks').checked, theme, OFFICE_BG ? chosenBg : 'off');
    await pptx.writeFile({ fileName: name.replace(/[\\/:*?"<>|]/g, '') + '.pptx' });
    $('okMsg').textContent = 'Downloaded with the "' + theme.name + '" style.' + (chosenStyle === 'auto' ? ' Press Download again for a different look.' : '');
    $('okMsg').classList.remove('hidden');
  } catch(e){
    console.error(e);
    alert('The file could not be created. Try again with fewer or smaller photos.');
  }
  btn.disabled = false; btn.textContent = 'Download PPT';
};
</script>
